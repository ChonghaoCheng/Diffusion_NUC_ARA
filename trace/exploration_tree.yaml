tree:
  - id: N01
    type: decision
    title: "Start from three-dimensional surface coverage"
    provenance: user
    timestamp: "2026-08-23T23:12"
    choice: >
      Design the coverage research around cylinder, hemisphere, and free-form
      three-dimensional patches from the outset; retain planar cases only for debugging.
      Use fixed-footprint, single-segment Flow Matching on 3D surfaces as the first
      go/no-go experiment before adding manipulator constraints or execution.
    alternatives:
      - "Develop a two-dimensional toy problem first and extend it later"
      - "Begin immediately with IK, MuJoCo, or physical execution"
    evidence:
      - "user direction in session 2026-08-23_001"
    status: resolved
    also_depends_on: []
  - id: N02
    type: experiment
    title: "Audit local compute and geometry-learning environment"
    provenance: ai-executed
    timestamp: "2026-08-23T23:12"
    result: >
      Two 32 GB V100 GPUs, 187 GiB host RAM, and ample workspace storage are present.
      The current torch 2.11.0+cu128 wheel cannot execute on V100 compute capability 7.0,
      and the active environment lacks the mesh, geodesic, scientific-computing, and
      plotting dependencies needed for M0-M2.
    evidence:
      - "ara/evidence/environment_probe_2026-08-23.md"
    status: resolved
    also_depends_on:
      - N01
  - id: N03
    type: decision
    title: "Execute the research milestones sequentially"
    provenance: user
    timestamp: "2026-08-23T23:26"
    choice: >
      Implement and verify the supplied experimental program milestone by milestone,
      completing M0 before M1 and retaining M2 as the first Flow Matching go/no-go gate.
    alternatives:
      - "Skip directly to Flow Matching implementation"
      - "Combine surface geometry, manipulator constraints, and execution in one stage"
    evidence:
      - "user direction in session 2026-08-23_001 turn 2"
    status: resolved
    also_depends_on:
      - N01
  - id: N04
    type: experiment
    title: "Validate M0 surface geometry and finite-footprint evaluation"
    provenance: ai-executed
    timestamp: "2026-08-23T23:26"
    result: >
      Fourteen direct regression tests passed. Cylinder area and half-circumference
      mesh-geodesic relative errors decreased monotonically from 1.138407e-02 at 12
      azimuth divisions to 1.784772e-04 at 96 divisions. The planar finite-footprint
      covered-fraction absolute error was 7.422e-03 on a 32 by 32 mesh. Five 3D surface
      families completed smoke evaluation in 0.0908 to 0.2176 seconds per instance.
    evidence:
      - "ara/evidence/m0_validation_2026-08-23.md"
    status: resolved
    also_depends_on:
      - N03
  - id: N05
    type: experiment
    title: "Validate the M1 classical coverage teacher"
    provenance: ai-executed
    timestamp: "2026-08-23T23:45"
    result: >
      Nineteen direct tests passed. At footprint radius 0.2 and missed-coverage tolerance
      0.05, the best teacher candidate had missed fractions 0.017578 on cylinder, 0.040203
      on hemisphere, 0.004047 on saddle, 0.008169 on torus, and 0.0 on free-form patch.
      The numeric-only smoke dataset contains five instances and 29 feasible candidates.
    evidence:
      - "ara/evidence/m1_teacher_validation_2026-08-23.md"
      - "results/teacher_m1_benchmark.json"
      - "results/teacher_m1_smoke_v2/manifest.jsonl"
    status: resolved
    also_depends_on:
      - N04
  - id: N06
    type: dead_end
    title: "Do not serialize infeasible teacher proposals as targets"
    provenance: ai-executed
    timestamp: "2026-08-23T23:45"
    hypothesis: >
      Serializing every ranked teacher proposal is acceptable because generation settings
      should normally produce feasible paths.
    failure_mode: >
      A low-resolution smoke run produced cylinder and hemisphere instances with no
      candidate below the configured tolerance, yet the first writer implementation saved
      those candidates as if they were valid targets.
    lesson: >
      Filter candidates through the exact coverage evaluator at write time, fail when none
      are feasible, and optionally rerun generation with denser track spacing.
    status: resolved
    evidence:
      - "ara/evidence/m1_teacher_validation_2026-08-23.md"
    also_depends_on:
      - N05
  - id: N07
    type: pivot
    title: "Advance from M1 teacher generation to M2 Flow Matching"
    provenance: ai-executed
    timestamp: "2026-08-23T23:45"
    from: "M1 classical teacher planning and dataset generation"
    to: "M2 fixed-footprint single-segment conditional Flow Matching"
    trigger: >
      Five target 3D surface families produced feasible teacher candidates, the dataset
      round trip passed without pickle, and invalid-target admission was closed.
    status: resolved
    also_depends_on:
      - N05
      - N06
  - id: N08
    type: experiment
    title: "Implement and validate the fixed-radius M2 Flow Matching pipeline"
    provenance: ai-executed
    timestamp: "2026-08-24T00:46"
    result: >
      Built fixed-waypoint topology-safe targets, stratified PyTorch datasets, a PointNet
      conditional path velocity field, conditional Flow Matching loss, Heun sampling,
      exact mesh projection, and coverage evaluation. The merged dataset contains 50
      instances and 279 feasible candidates; the full regression suite passed 25 tests.
    evidence:
      - "ara/evidence/m2_flow_matching_go_no_go_2026-08-24.md"
      - "results/teacher_m2_fixed_r_k1_50/manifest.jsonl"
    status: resolved
    also_depends_on:
      - N07
  - id: N09
    type: dead_end
    title: "Reject raw fixed-index M2 Flow Matching at the go/no-go gate"
    provenance: ai-executed
    timestamp: "2026-08-24T00:46"
    hypothesis: >
      A fixed-radius, single-segment conditional Flow Matching model trained on the
      multi-solution teacher set can reliably generate low-miss 3D coverage paths on
      held-out instances from all five surface families.
    failure_mode: >
      Top-8 raw generation achieved only 10 percent feasibility on ten stratified held-out
      instances. Generated cylinder and torus paths omitted coverage bands; iid base noise
      also produced high-frequency path disorder.
    lesson: >
      Do not proceed to broader conditioning or manipulator integration. First resolve
      waypoint correspondence across spiral, orthogonal raster, direction, and phase modes,
      and improve closed-surface coverage generation.
    status: resolved
    evidence:
      - "ara/evidence/m2_flow_matching_go_no_go_2026-08-24.md"
      - "results/flow_matching_m2_fixed_r_k1_run1/eval_k8/metrics.json"
    also_depends_on:
      - N08
  - id: N10
    type: experiment
    title: "Ablate smooth base noise and short coverage repair"
    provenance: ai-executed
    timestamp: "2026-08-24T00:46"
    result: >
      Correlated path noise visibly removed much of the high-frequency disorder but did
      not improve raw feasibility, which remained 10 percent. A maximum 12-step insertion
      repair increased feasibility to 60 percent, repairing free-form, hemisphere, and
      saddle cases while both cylinder and both torus cases remained infeasible.
    evidence:
      - "ara/evidence/m2_flow_matching_go_no_go_2026-08-24.md"
      - "results/flow_matching_m2_fixed_r_k1_run2_smooth_base/eval_k8_refined/metrics.json"
    status: resolved
    also_depends_on:
      - N09
  - id: N11
    type: pivot
    title: "Stop expansion at M2 and return to path representation"
    provenance: ai-executed
    timestamp: "2026-08-24T00:46"
    from: "M2 fixed-radius single-segment Flow Matching rollout"
    to: "Sequence-alignment and closed-surface mode diagnosis"
    trigger: >
      Raw FM failed the stated stability gate and short refinement left all held-out
      cylinder and torus instances infeasible.
    status: resolved
    also_depends_on:
      - N09
      - N10
  - id: N12
    type: pivot
    title: "Reframe the paper around direct robot-liftable coverage generation"
    provenance: user-revised
    timestamp: "2026-08-24T10:44:12+10:00"
    from: "Flow Matching generation of surface-only three-dimensional coverage paths"
    to: "Amortized direct generation of finite-footprint, segment-budgeted, robot-liftable configuration-space plans"
    trigger: >
      The researcher accepted the representation and robotics criticisms, corrected the
      interpretation of ell-star(k) and rho-star, and made workspace-first versus direct
      C-space liftability the central comparison.
    status: resolved
    also_depends_on:
      - N11
  - id: N13
    type: experiment
    title: "Reject fixed-control-point path compression in Stage 0"
    provenance: ai-executed
    timestamp: "2026-08-24T10:44:12+10:00"
    result: >
      Audited 200 expert paths over four 3D surface families and varying footprint radii.
      At 128 B-spline control points, p95 normalized geometry error was 0.3290 and p95
      absolute missed-coverage change was 0.04962, both above the registered limits.
    evidence:
      - "ara/evidence/stage0_representation_audit_2026-08-24.md"
      - "results/stage0_representation_audit_200/summary.json"
    status: resolved
    also_depends_on:
      - N12
  - id: N14
    type: decision
    title: "Adopt canonical padded variable-token paths"
    provenance: user
    timestamp: "2026-08-24T10:44:12+10:00"
    choice: >
      Determine token count from known surface area and footprint radius, use uniform
      arclength parameterization with deterministic gauge fixing, and pad plus mask within
      batches while preserving genuine planning modes.
    alternatives:
      - "Use one fixed waypoint or B-spline control-point count for every instance"
      - "Predict discrete trajectory length with the neural model"
    evidence:
      - N13
      - "src/diffusion_coverage/representation/variable_token.py"
    status: resolved
    also_depends_on:
      - N13
  - id: N15
    type: experiment
    title: "Measure the pre-training UR5e workspace-first liftability gap"
    provenance: ai-executed
    timestamp: "2026-08-24T10:44:12+10:00"
    result: >
      Evaluated 200 classical plans with a MuJoCo UR5e numerical continuation checker.
      Overall lift success was 52.0 percent and was 53.3 percent among 195 fully
      posewise-calibrated cases. Success was 2 percent on cylinders, 6 percent on
      hemispheres, and 100 percent on saddle and free-form patches.
    evidence:
      - "ara/evidence/ur5e_liftability_gate_2026-08-24.md"
      - "results/ur5e_liftability_200/summary.json"
    status: resolved
    also_depends_on:
      - N12
      - N14
  - id: N16
    type: experiment
    title: "Stress-test difficult liftability failures"
    provenance: ai-executed
    timestamp: "2026-08-24T10:44:12+10:00"
    result: >
      Reused identical base transforms for five cylinder and five hemisphere failures,
      halved pose spacing to 2.5 mm, doubled beam width to 24, and doubled random restarts
      to 32. All ten remained non-liftable, although detailed failure labels changed.
    evidence:
      - "ara/evidence/ur5e_liftability_gate_2026-08-24.md"
      - "results/ur5e_liftability_sensitivity_10/summary.json"
    status: resolved
    also_depends_on:
      - N15
  - id: N17
    type: dead_end
    title: "Invalidate Stage 1 results built on a reconstructed quadrature"
    provenance: ai-executed
    timestamp: "2026-08-24T13:20:28+10:00"
    hypothesis: >
      Reconstructing archived meshes with a fresh one-sample-per-face quadrature and
      float32 waypoints preserves the teacher and evaluation contract closely enough.
    failure_mode: >
      The reconstructed quadrature changed hard missed-coverage values, and float32
      serialization moved threshold-tight paths across the feasibility boundary.
    lesson: >
      Archive the exact quadrature, store paths in float64, and hard-check the complete
      learning roundtrip before treating any model benchmark as formal evidence.
    status: resolved
    evidence:
      - "ara/evidence/stage1_corrected_go_no_go_2026-08-24.md"
    also_depends_on: [N13]
  - id: N18
    type: decision
    title: "Adopt a robust serialized teacher contract"
    provenance: ai-executed
    timestamp: "2026-08-24T13:20:28+10:00"
    choice: >
      Restore exact archived quadrature, hard-recheck serialized candidates, require a
      missed-coverage margin, and reject or repair candidates that do not survive the
      model-input roundtrip.
    alternatives:
      - "Continue using newly sampled quadrature at load time"
      - "Treat threshold flips as harmless floating-point noise"
    evidence:
      - "results/stage1_robust_200/audit_segment_preserving_density23_validation.json"
    status: resolved
    also_depends_on: [N17]
  - id: N19
    type: experiment
    title: "Repeat Stage 0 under the corrected data contract"
    provenance: ai-executed
    timestamp: "2026-08-24T13:20:28+10:00"
    result: >
      Re-audited 200 expert plans. At 128 B-spline control points, p95 normalized
      geometry error was 0.329126, p95 absolute missed-fraction change was 0.025391,
      and p95 absolute relative-length change was 0.038799. No tested fixed count
      passed all thresholds, so the variable-token decision remains valid.
    evidence:
      - "ara/evidence/stage1_corrected_go_no_go_2026-08-24.md"
      - "results/stage0_representation_audit_corrected/summary.json"
    status: resolved
    also_depends_on: [N18]
  - id: N20
    type: dead_end
    title: "Reject global path resampling and repeated-token preservation"
    provenance: ai-executed
    timestamp: "2026-08-24T13:20:28+10:00"
    hypothesis: >
      A global intrinsic resample or repeated source waypoints can provide a robust
      variable-token learning target without changing path semantics.
    failure_mode: >
      Global resampling shortcut source turns and reduced mean length, while repeated
      tokens distorted arclength weighting and produced excessive generated travel.
    lesson: >
      Allocate samples within each original source segment and retain every segment
      boundary; use actual normalized intrinsic arclength for model positions.
    status: resolved
    evidence:
      - "results/stage1_robust_200/audit_uniform_policy_validation.json"
      - "results/stage1_robust_200/audit_segment_preserving_density23_validation.json"
    also_depends_on: [N19]
  - id: N21
    type: experiment
    title: "Evaluate contract-corrected variable-token surface Flow Matching"
    provenance: ai-executed
    timestamp: "2026-08-24T13:20:28+10:00"
    result: >
      On 40 held-out instances, K=8 feasibility increased from 22.5 percent for the
      3.2k-update segment-preserving model to 32.5 percent with longer training and
      50.0 percent with a 10-percent-correlated base path. The last model required
      1.635 times teacher path length on average and therefore failed the joint gate.
    evidence:
      - "ara/evidence/stage1_corrected_go_no_go_2026-08-24.md"
      - "results/stage1_corrected_summary/report.md"
    status: resolved
    also_depends_on: [N20]
  - id: N22
    type: pivot
    title: "Stop at the corrected Stage 1 no-go gate"
    provenance: ai-executed
    timestamp: "2026-08-24T13:20:28+10:00"
    from: "Stage 1 variable-token surface Flow Matching"
    to: "Resolve surface-planner underfitting and over-travel before multimodality or C-space FM"
    trigger: >
      The best corrected run reached only 50 percent feasibility and 1.635 times teacher
      length, below the registered 90-percent and 1.10-times gate.
    status: resolved
    also_depends_on: [N21]
  - id: N23
    type: dead_end
    title: "Reject missed-fraction-first teacher ranking"
    provenance: ai-executed
    timestamp: "2026-08-24T13:56:05+10:00"
    hypothesis: >
      Sorting robust-feasible candidates by missed fraction and then path length is an
      acceptable implementation of the registered surface-planning objective.
    failure_mode: >
      The ordering changed 152 of 200 selected targets and made the previous targets
      1.0708 times longer on average than constrained-shortest targets.
    lesson: >
      Treat missed coverage as a hard constraint and share one constrained length key
      across teacher generation, sanitization, and evaluation.
    status: resolved
    evidence:
      - "ara/evidence/stage1_objective_corrected_go_no_go_2026-08-24.md"
    also_depends_on: [N22]
  - id: N24
    type: decision
    title: "Adopt one constrained coverage objective helper"
    provenance: user-revised
    timestamp: "2026-08-24T13:56:05+10:00"
    choice: >
      Rank candidates by feasibility violation first and path quality second, so every
      hard-feasible plan is ordered by length rather than excess coverage.
    alternatives:
      - "Continue lexicographically minimizing missed fraction and length"
      - "Use a weighted scalar coverage-length objective"
    evidence:
      - "src/diffusion_coverage/coverage/objective.py"
      - "ara/evidence/stage1_objective_corrected_go_no_go_2026-08-24.md"
    status: resolved
    also_depends_on: [N23]
  - id: N25
    type: experiment
    title: "Retrain Stage 1 on objective-corrected targets"
    provenance: ai-executed
    timestamp: "2026-08-24T13:56:05+10:00"
    result: >
      The learning-target roundtrip was 100 percent hard-feasible with a 1.0022 mean
      length ratio. Fresh 5k-step training reached 32.5 percent K=8 feasibility and
      1.614 times teacher length; warm 3k-step training reached 72.5 percent feasibility
      and 1.772 times teacher length. All 41 tests passed.
    evidence:
      - "ara/evidence/stage1_objective_corrected_go_no_go_2026-08-24.md"
      - "results/stage1_objective_corrected_summary/report.md"
    status: resolved
    also_depends_on: [N24]
  - id: N26
    type: pivot
    title: "Retain the Stage 1 no-go after objective correction"
    provenance: ai-executed
    timestamp: "2026-08-24T13:56:05+10:00"
    from: "Objective-corrected surface Flow Matching"
    to: "Resolve coverage-versus-travel coupling before Stage 2 or C-space Flow Matching"
    trigger: >
      The strongest corrected-target run remained below 90 percent feasibility and above
      1.10 times teacher length, reaching 72.5 percent and 1.772 times respectively.
    status: resolved
    also_depends_on: [N25]
  - id: N27
    type: dead_end
    title: "Reject candidate-family datasets without full learning roundtrip admission"
    provenance: ai-executed
    timestamp: "2026-08-24T15:13:13+10:00"
    hypothesis: >
      Selecting one canonical proposal name from the serialized archive is sufficient to
      define a clean single-family learning cohort.
    failure_mode: >
      The first cohort contained 187 instances, but only 91.9 percent of its validation
      targets remained hard-feasible after the actual float32 model-input roundtrip; three
      of 37 validation cylinder targets failed.
    lesson: >
      Candidate-name filtering must precede the split and every retained candidate must
      pass the exact coordinate, dtype, and reconstruction path used by learning.
    status: resolved
    evidence: ["ara/evidence/stage1_single_family_uv_2026-08-24.md"]
    also_depends_on: [N26]
  - id: N28
    type: decision
    title: "Adopt candidate-specific full-roundtrip target admission"
    provenance: ai-executed
    timestamp: "2026-08-24T15:13:13+10:00"
    choice: >
      Filter by exact canonical candidate family before dataset splitting, then retain an
      instance only when that candidate survives the complete learning-input roundtrip and
      unchanged hard checker.
    alternatives:
      - "Filter only at sample retrieval time"
      - "Accept archive-feasible candidates without model-input reconstruction"
    evidence:
      - "src/diffusion_coverage/learning/teacher_dataset.py"
      - "scripts/sanitize_teacher_dataset.py"
      - "ara/evidence/stage1_single_family_uv_2026-08-24.md"
    status: resolved
    also_depends_on: [N27]
  - id: N29
    type: experiment
    title: "Ablate single-family XYZ supervision and objective-aware losses"
    provenance: ai-executed
    timestamp: "2026-08-24T15:13:13+10:00"
    result: >
      On the same 35 validation instances, velocity-only single-family training reached
      57.1 percent feasibility and 1.363 times teacher length. Coverage-heavy and balanced
      variants reached 74.3 percent feasibility but required 1.839 and 1.440 times teacher
      length. Tangent and surface-consistency variants reached 65.7 and 60.0 percent
      feasibility at 1.348 and 1.359 times teacher length. No variant passed the joint gate.
    evidence:
      - "ara/evidence/stage1_single_family_uv_2026-08-24.md"
      - "results/stage1_single_family_summary/report.md"
      - "results/stage1_single_family_summary/single_family_objective_ablation.png"
    status: resolved
    also_depends_on: [N28]
  - id: N30
    type: dead_end
    title: "Stop scalar-loss tuning on raw dense XYZ trajectories"
    provenance: ai-executed
    timestamp: "2026-08-24T15:13:13+10:00"
    hypothesis: >
      Coverage, excess-length, tangent, or surface-consistency penalties on the raw XYZ
      vector field are sufficient to meet the Stage 1 feasibility-quality gate.
    failure_mode: >
      The losses moved the feasibility-versus-travel operating point but retained local
      reversals, cross-band connectors, repeated loops, and shared hard failures; a
      multi-checkpoint proposal oracle did not exceed 74.3 percent feasibility.
    lesson: >
      Change trajectory representation or coupling before further scalar-weight scans.
    status: resolved
    evidence:
      - "ara/evidence/stage1_single_family_uv_2026-08-24.md"
      - "results/stage1_single_family_summary/report.md"
    also_depends_on: [N29]
  - id: N31
    type: pivot
    title: "Move Stage 1 generation from ambient XYZ to analytic surface charts"
    provenance: ai-executed
    timestamp: "2026-08-24T15:13:13+10:00"
    from: "Raw dense three-dimensional waypoint generation with post-hoc projection"
    to: "Intrinsic analytic UV generation followed by exact surface mapping and the same 3D hard checker"
    trigger: >
      Raw XYZ samples showed large post-hoc projection displacement and persistent
      sweep-order failures after single-family and loss ablations.
    status: resolved
    also_depends_on: [N30]
  - id: N32
    type: experiment
    title: "Implement and train the analytic-UV Stage 1 ablation"
    provenance: ai-executed
    timestamp: "2026-08-24T15:13:13+10:00"
    result: >
      Added analytic parameter inversion and two-dimensional path support across the
      dataset, model, noise, sampling, training, audit, and evaluation stack. All 35 UV
      validation targets passed the unchanged hard checker with a 0.99835 mean length
      ratio. Training completed 5,000 steps with best validation loss 0.04142; the
      interrupted K=8 evaluation produced no result and remains pending.
    evidence:
      - "ara/evidence/stage1_single_family_uv_2026-08-24.md"
      - "results/flow_matching_stage1_single_family_uv_run1/target_audit_validation.json"
      - "results/flow_matching_stage1_single_family_uv_run1/history.json"
      - "results/flow_matching_stage1_single_family_uv_run1/best.pt"
    status: resolved
    also_depends_on: [N31]
  - id: N33
    type: experiment
    title: "Complete dense analytic-UV K=8 evaluation"
    provenance: ai-executed
    timestamp: "2026-08-24T22:40:00+10:00"
    result: >
      Dense analytic UV reached 77.1 percent hard feasibility and 1.536 times teacher
      length on 35 validation instances. It improved feasibility over every dense XYZ
      variant but still failed both registered thresholds.
    evidence:
      - "ara/evidence/stage1_structured_control_gate_2026-08-24.md"
      - "results/flow_matching_stage1_single_family_uv_run1/eval_k8/metrics.json"
    status: resolved
    also_depends_on: [N32]
  - id: N34
    type: dead_end
    title: "Reject scalar intrinsic-length fine-tuning as a joint solution"
    provenance: ai-executed
    timestamp: "2026-08-24T22:40:00+10:00"
    hypothesis: >
      Excess-length and tangent losses in analytic UV can remove redundant travel while
      preserving the dense UV model's coverage.
    failure_mode: >
      Mean length reached 1.079 times teacher but hard feasibility collapsed to 17.1
      percent. Its six feasible instances added no new success beyond dense UV.
    lesson: >
      Explicitly represent coverage-stroke count and ordering; scalar path length cannot
      distinguish redundant loops from required coverage bands.
    status: resolved
    evidence:
      - "ara/evidence/stage1_structured_control_gate_2026-08-24.md"
    also_depends_on: [N33]
  - id: N35
    type: dead_end
    title: "Reject control extraction after mesh-geodesic resampling"
    provenance: ai-executed
    timestamp: "2026-08-24T22:40:00+10:00"
    hypothesis: >
      Ramer-Douglas-Peucker simplification after mesh-geodesic canonicalization recovers
      the original analytic raster controls.
    failure_mode: >
      Mesh-induced micro-turns survived simplification, producing 96 to 1,384 controls
      instead of the geometry-derived 10 to 32.
    lesson: >
      Extract analytic controls from original teacher waypoints before mesh resampling,
      and keep repaired candidates outside the fixed-structure cohort.
    status: resolved
    evidence:
      - "ara/evidence/stage1_structured_control_gate_2026-08-24.md"
    also_depends_on: [N34]
  - id: N36
    type: decision
    title: "Adopt geometry-derived raster stroke controls"
    provenance: ai-executed
    timestamp: "2026-08-24T22:40:00+10:00"
    choice: >
      Represent an unrepaired raster as alternating stroke endpoints in unwrapped UV,
      derive token count from task geometry, densify only stroke segments at decode time,
      and retain direct connectors.
    alternatives:
      - "Continue dense UV waypoint generation"
      - "Use post-hoc shortcutting as the primary planner"
      - "Include sanitizer repair insertions in the same fixed structure"
    evidence:
      - "src/diffusion_coverage/coverage/patterns.py"
      - "ara/evidence/stage1_structured_control_gate_2026-08-24.md"
    status: resolved
